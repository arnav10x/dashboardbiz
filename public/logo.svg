<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bodyFront" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0d0b2a"/>
    </linearGradient>
    <linearGradient id="bodyTop" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#2d2a60"/>
      <stop offset="100%" stop-color="#1a1745"/>
    </linearGradient>
    <linearGradient id="bodySide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14113a"/>
      <stop offset="100%" stop-color="#09071e"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0.1" y1="0.95" x2="0.9" y2="0.05">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="40%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- P front face (main body) -->
  <path d="M10 12 L10 108 L30 108 L30 68 L52 68 Q78 68 78 40 Q78 12 52 12 Z" fill="url(#bodyFront)"/>

  <!-- P bowl inner cutout -->
  <path d="M30 26 L30 54 L52 54 Q60 54 60 40 Q60 26 52 26 Z" fill="#08061a"/>

  <!-- 3D top face of P -->
  <path d="M10 12 L20 4 L62 4 Q90 4 92 30 L90 42 Q90 16 62 14 L30 14 L30 26 L28 26 L20 16 L10 12 Z" fill="url(#bodyTop)" opacity="0.9"/>

  <!-- 3D right side face of P -->
  <path d="M52 12 L62 4 Q90 4 92 30 L92 50 Q92 74 62 82 L52 68 Q78 68 78 40 Q78 12 52 12 Z" fill="url(#bodySide)"/>

  <!-- 3D bottom side face -->
  <path d="M30 108 L40 100 L40 76 L30 68 Z" fill="#0a0820" opacity="0.6"/>
  <path d="M30 68 L40 76 L62 76 L52 68 Z" fill="#0d0b28" opacity="0.5"/>

  <!-- Lightning bolt / arrow cutting through -->
  <path d="M76 16 L54 58 L68 58 L44 104 L80 56 L65 56 L88 16 Z" fill="url(#boltGrad)" filter="url(#boltGlow)"/>

  <!-- Bolt highlight edge -->
  <path d="M88 16 L86 18 L76 18 L76 16 Z" fill="rgba(200,170,255,0.4)"/>
  <path d="M68 58 L66 60 L54 60 L54 58 Z" fill="rgba(200,170,255,0.2)"/>
</svg>
