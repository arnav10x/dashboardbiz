<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="purpleGrad" x1="60" y1="185" x2="170" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="40%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- P letter with inner bowl hole (evenodd compound path) -->
  <path fill-rule="evenodd" fill="#111111" d="
    M 18 18
    L 115 18
    Q 182 18 182 85
    Q 182 148 115 148
    L 54 148
    L 54 182
    L 18 182
    Z
    M 54 48
    L 112 48
    Q 146 48 146 85
    Q 146 120 112 120
    L 54 120
    Z
  "/>

  <!-- Diagonal purple arrow shaft: from lower-mid to upper-right -->
  <polygon
    points="83,185 103,185 158,38 138,38"
    fill="url(#purpleGrad)"
  />

  <!-- Arrowhead pointing upper-right -->
  <polygon
    points="128,18 178,42 158,64"
    fill="url(#purpleGrad)"
  />

  <!-- Speed bars at lower-left (3 diagonal parallel bars) -->
  <polygon points="2,162  30,162  20,180  0,178"  fill="url(#purpleGrad)" opacity="0.90"/>
  <polygon points="2,144  26,144  16,162  0,162"  fill="url(#purpleGrad)" opacity="0.70"/>
  <polygon points="2,126  22,126  12,144  0,144"  fill="url(#purpleGrad)" opacity="0.50"/>
</svg>
